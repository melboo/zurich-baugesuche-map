name: Update Baugesuche data

on:
  schedule:
    # 04:17 UTC daily (~05:17/06:17 Zürich). Offset avoids the top-of-hour rush.
    - cron: "17 4 * * *"
  workflow_dispatch: {}   # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GDAL system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Fetch and process data
        run: python scripts/update_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/baugesuche_zuerich.geojson docs/data/meta.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: daily refresh $(date -u +%Y-%m-%d)"
            git push
          fi
